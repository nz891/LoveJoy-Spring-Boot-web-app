<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Request Evaluation</title>

    <!--bootstrap and icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

    <style>
        body {
            background: #eef1f5;
        }
        .preview-img {
            display: none;
            max-width: 200px;
            border-radius: 10px;
            margin-top: 10px;
            border: 2px solid #ddd;
        }
    </style>

    <script>
        // shows preview of uploaded image
        function previewImage(event){
            const output = document.getElementById('preview');
            output.src = URL.createObjectURL(event.target.files[0]);
            output.style.display = 'block';
        }
    </script>
</head>

<body class="p-4">

<div class="container">
    <div class="row justify-content-center">

        <!-- top bar with logout -->
        <div class="header-bar d-flex justify-content-between align-items-center shadow">
        <h3 class="m-0"><i class="bi bi-speedometer2"></i> Request Evalution</h3>

        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
        </div>

        <div class="col-md-7">

            <!-- main form card-->
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="m-0">
                        <i class="bi bi-journal-plus"></i>
                        Make Your Request
                    </h4>
                </div>

                <div class="card-body p-4">

                    <!-- backend error-->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!--evaluation request form -->
                    <form th:action="@{/evaluation}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!--description-->
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="bi bi-card-text"></i> Description
                            </label>
                            <textarea name="description" required class="form-control" rows="4"
                                      placeholder="Describe the item you want us to evaluate..."></textarea>
                        </div>

                        <!--preferred contact -->
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="bi bi-telephone-forward"></i> Preferred Contact
                            </label>
                            <select name="preferredContact" class="form-select">
                                <option value="EMAIL">Email</option>
                                <option value="PHONE">Phone</option>
                            </select>
                        </div>

                        <!-- upload photo-->
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="bi bi-image"></i> Upload Photo
                            </label>
                            <input name="photo" type="file" accept="image/*"
                                   class="form-control" onchange="previewImage(event)"/>
                        </div>

                        <!--preview image-->
                        <img id="preview" class="preview-img"/>

                        <!--submit button-->
                        <button class="btn btn-primary w-100 mt-3">
                            <i class="bi bi-send-check-fill"></i>
                            Submit Evaluation Request
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
