<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"><head><title>Reset</title>
  <!--bootstrap for basic layout-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/></head>
<body><div class="container p-4">
  <h3>Reset Password</h3>
  <!-- password reset form -->
  <form th:action="@{/reset-password}" method="post">
    <!-- CSRF token -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <!--reset token sent by email-->
    <input type="hidden" name="token" th:value="${token}" />
    <!--new password-->
    <div class="mb-3"><input name="password" type="password" placeholder="New password" class="form-control"/></div>
    <!--confirm new password-->
    <div class="mb-3"><input name="confirmPassword" type="password" placeholder="Confirm password" class="form-control"/></div>
    <!-- submit-->
    <button class="btn btn-primary" type="submit">Reset</button>
  </form>
</div></body></html>
