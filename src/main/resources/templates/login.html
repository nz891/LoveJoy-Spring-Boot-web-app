<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Lovejoy</title>
    <!-- bootstrap and icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #ffffff;
        }

        .love-card {
            background-color: #ffd6ec;
            border-radius: 18px;
        }
    </style>

    <!-- google recaptcha -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body class="d-flex align-items-center" style="height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <!--header icon and page title -->
            <div class="text-center mb-4">
                <i class="fa fa-heart" style="font-size: 60px; color: #ff4d88;"></i>
                <h3 class="mt-3">Lovejoy Login</h3>
            </div>

            <!--login card -->
            <div class="card shadow-lg border-0 love-card">
                <div class="card-body p-4">

                    <!-- login error messages -->
                    <div th:if="${param.error != null}">
                        <!-- accnt locked after too many attempts -->
                        <div th:if="${param.locked != null}" class="alert alert-danger">
                            Your account has been locked due to too many failed login attempts.
                            Please try again later :(
                        </div>

                        <!--wrong email or password -->
                        <div th:if="${param.locked == null}" class="alert alert-danger">
                            Incorrect email or password :(
                        </div>
                    </div>

                    <!-- login form -->
                    <form th:action="@{/login}" method="post">
                        <!-- CSRF token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- email input -->
                        <div class="mb-3">
                            <label>Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                                <input name="username" class="form-control" placeholder="Email"/>
                            </div>
                        </div>

                        <!--password-->
                        <div class="mb-3">
                            <label>Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-lock"></i></span>
                                <input name="password" type="password" class="form-control" placeholder="Password"/>
                            </div>
                        </div>

                        <!-- google recaptcha -->
                        <div class="mb-3">
                            <label>Prove you’re not a robot</label>
                            <div class="g-recaptcha"
                                 th:attr="data-sitekey=${@environment.getProperty('recaptcha.site-key')}">
                            </div>
                        </div>

                        <!-- login button-->
                        <button class="btn btn-primary w-100" type="submit">
                            <i class="fa fa-sign-in-alt"></i> Login
                        </button>
                    </form>

                    <!-- otherlinks -->
                    <div class="text-center mt-3">
                        <a href="/forgot-password">Forgot Password?</a> |
                        <a href="/register">Register</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
