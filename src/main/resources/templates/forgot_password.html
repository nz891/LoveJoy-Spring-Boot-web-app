<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <!-- bootstrap for basic styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #ffffff;
        }
        .love-card {
            background-color: #ffd6ec;
            border-radius: 18px;
        }
    </style>
</head>

<body class="d-flex align-items-center" style="height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <!-- main card for the password reset form -->
            <div class="card shadow border-0 love-card">
                <div class="card-body p-4">
                    <h4 class="mb-3 text-center">
                        Lets reset your password :)
                    </h4>

                    <!-- shows error message from backend if something goes wrong -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!-- user only enters their email -->
                    <form th:action="@{/forgot-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- CSRF token required for Spring security -->
                        <div class="mb-3">
                            <label>Please enter your email</label>
                            <input name="email" class="form-control" placeholder="Email" required/>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">
                            Continue
                        </button>
                    </form>

                </div>
            </div>

            <!-- link so they can go back to login if they clicked by mistake -->
            <div class="text-center mt-3">
                <a href="/login">Back to Login</a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
