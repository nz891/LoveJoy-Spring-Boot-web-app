<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Two-Factor Authentication</title>
  <!-- bootstrap for layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body class="bg-light d-flex align-items-center" style="height:100vh;">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <!-- main 2FA card -->
      <div class="card shadow-lg border-0">
        <div class="card-body p-4">
          <h4 class="mb-3 text-center">Enter your 6-digit code</h4>

          <!-- backend error if wrong code or expired code-->
          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

          <p class="text-muted">
            We’ve emailed a one-time code to your registered address.
            Please enter it below to complete login.
          </p>

          <!-- 2FA form-->
          <form th:action="@{/2fa}" method="post">
            <!-- CSRF token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!--code input-->
            <div class="mb-3">
              <label>Code</label>
              <input name="code" class="form-control" placeholder="123456" required/>
            </div>

            <!-- submit-->
            <button class="btn btn-primary w-100" type="submit">
              Verify code
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
