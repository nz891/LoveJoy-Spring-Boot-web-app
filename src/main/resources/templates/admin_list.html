<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Evaluation Requests</title>

    <!-- bootstrap anf icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>

    <style>
        body {
            background: #f4f6f9;
        }
        .table img {
            max-height: 60px;
        }
        .header-bar {
            background: #343a40;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="p-4">

<div class="container">

    <!-- top bar of the admin dashboard (with logout button) -->
    <div class="header-bar d-flex justify-content-between align-items-center shadow">
        <h3 class="m-0"><i class="bi bi-speedometer2"></i> Admin Dashboard</h3>

        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>

    <!-- main card that shows all evaluation requests -->
    <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <i class="bi bi-list-task me-2"></i>
            <strong>Evaluation Requests</strong>
        </div>

        <div class="card-body p-0">
            <!-- table where all requests show up -->
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>              <!-- request number -->
                    <th>User</th>           <!-- user's email -->
                    <th>Description</th>    <!-- what they wrote -->
                    <th>Contact Method</th> <!-- how they want to be contacted -->
                    <th>Date</th>           <!-- time submitted -->
                    <th>Photo</th>          <!-- picture they uploaded -->
                </tr>
                </thead>

                <tbody>
                <!-- looping through requests from backend -->
                <tr th:each="r : ${requests}">
                    <td th:text="${r.id}"></td>
                    <td>
                        <i class="bi bi-person-circle text-primary"></i>
                        <span th:text="${r.user.email}"></span>
                    </td>
                    <td th:text="${r.description}"></td>
                    <td>
                        <!-- badge showingw preferred contact -->
                        <span class="badge bg-info text-dark" th:text="${r.preferredContact}"></span>
                    </td>
                    <td>
                        <i class="bi bi-clock-history"></i>
                        <!-- date -->
                        <span th:text="${#temporals.format(r.createdAt, 'dd MMM yyyy HH:mm')}"></span>
                    </td>

                    <td>
                        <!-- if they uploaded a photo then show button -->
                        <a th:if="${r.photoPath}"
                           th:href="@{'/uploads/' + ${r.photoPath}}"
                           target="_blank"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-image"></i> View
                        </a>

                        <!-- if no photo, show 'No Photo' -->
                        <span th:if="${r.photoPath == null}" class="text-muted">
                            <i class="bi bi-x-circle"></i> No Photo
                        </span>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>

</div>

</body>
</html>
