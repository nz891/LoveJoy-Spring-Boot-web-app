<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- bootstrap -->
    <title>Answer Security Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #ffffff;
        }
        .love-card {
            background-color: #ffd6ec;
            border-radius: 18px;
        }
    </style>
</head>

<body class="d-flex align-items-center" style="height:100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <!-- main card for answering the user's security question -->
            <div class="card shadow border-0 love-card">
                <div class="card-body p-4">
                    <h4 class="mb-3 text-center">
                        Please answer the security question
                    </h4>

                    <!-- showing which email -->
                    <p class="mb-3">
                        Security question for: <strong th:text="${email}">email@example.com</strong>
                    </p>

                    <!-- displaying the saved security question -->
                    <div class="mb-3">
                        <label>Security Question</label>
                        <input class="form-control" th:value="${securityQuestion}" readonly/>
                    </div>

                    <!-- error message from backend if answer was wrong -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!-- form where user submits their answer -->
                    <form th:action="@{/forgot-password/question}" method="post">
                        <!-- CSRF token for security -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <!-- sending the email again so backend knows which user we’re verifying -->
                        <input type="hidden" name="email" th:value="${email}"/>

                        <div class="mb-3">
                            <label>Your Answer</label>
                            <input name="securityAnswer" class="form-control" required
                                   placeholder="Type your answer here"/>
                        </div>

                        <!-- back to login -->
                        <button class="btn btn-primary w-100" type="submit">
                            Verify &amp; Send Reset Link
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="/login">Back to Login</a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
