<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Lovejoy</title>
    <!--bootstrap and icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>

<body class="bg-light p-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <!-- main registration card -->
            <div class="card shadow-lg border-0" style="background-color:#ffd6ec;">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">
                        <i class="fa fa-user-plus"></i> Create Account
                    </h3>

                    <!-- error message from backend-->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!-- registration form-->
                    <form th:action="@{/register}" method="post">
                        <!-- CSRF token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- email -->
                        <div class="mb-3">
                            <label>Email</label>
                            <input name="email" class="form-control"/>
                        </div>

                        <!-- password-->
                        <div class="mb-3">
                            <label>Password</label>
                            <input name="password" type="password" class="form-control"/>
                        </div>

                        <!-- cnfirm password-->
                        <div class="mb-3">
                            <label>Confirm Password</label>
                            <input name="confirmPassword" type="password" class="form-control"/>
                        </div>

                        <!-- name-->
                        <div class="mb-3">
                            <label>Name</label>
                            <input name="name" class="form-control"/>
                        </div>

                        <!-- phone-->
                        <div class="mb-3">
                            <label>Phone</label>
                            <input name="phone" class="form-control"/>
                        </div>

                        <!-- security question dropdown-->
                        <div class="mb-3">
                            <label>Security Question</label>
                            <select name="securityQuestion" class="form-select" required>
                                <option value="" disabled selected>Choose a question</option>
                                <option value="What is the name of your childhood pet?">What is the name of your childhood pet?</option>
                                <option value="What is your mom's middle name?">What is your mom's middle name?</option>
                                <option value="What is the name of the hospital you were born in?">What is the name of the hospital you were born in?</option>
                            </select>
                        </div>

                        <!-- security answer -->
                        <div class="mb-3">
                            <label>Security Answer</label>
                            <input name="securityAnswer" type="text" class="form-control" required
                                   placeholder="You’ll need this to reset your password :)"/>
                        </div>

                        <!-- submit button-->
                        <button class="btn btn-primary w-100" type="submit">
                            <i class="fa fa-check"></i> Create Account
                        </button>

                    </form>
                </div>
            </div>

            <!--login link-->
            <div class="text-center mt-3">
                <a href="/login">Already have an account?</a>
            </div>

        </div>
    </div>
</div>
</body>
</html>
